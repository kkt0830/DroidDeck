name: Build experimental PanVK Kbase
on:
  push:
    branches: [work]
    paths: [tools/panvk/**, .github/workflows/build-panvk.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config python3-venv bison flex glslang-tools libdrm-dev libwayland-dev wayland-protocols libx11-dev libx11-xcb-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev libxxf86vm-dev libxrandr-dev zlib1g-dev libexpat1-dev
          python3 -m venv /tmp/panvk-venv
          /tmp/panvk-venv/bin/pip install meson==1.8.5 mako==1.3.10 pyyaml==6.0.2 packaging==25.0
      - name: Build pinned glibc driver with Wayland WSI
        run: |
          export PATH="/tmp/panvk-venv/bin:$PATH"
          bash tools/panvk/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-panvk-kbase-glibc
          path: panvk-artifact/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: panvk-build-logs
          path: panvk-build/build/meson-logs/
